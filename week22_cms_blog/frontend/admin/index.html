<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="header">
        <h1>CMS Admin Dashboard</h1>
        <button id="create-post-btn" class="btn-primary">+ New Post</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="posts-table-body">

        </tbody>
    </table>

    <div id="post-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Create New Post</h2>
            
            <form id="post-form">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="post-title" required>
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="post-status">
                        <option value="draft">Draft (Hidden)</option>
                        <option value="published">Published (Public)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="post-content" rows="6" required></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Save Post</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="../src/pages/admin.js"></script>
</body>
</html>
