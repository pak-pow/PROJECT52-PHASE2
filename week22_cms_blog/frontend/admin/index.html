<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <div id="dashboard-container" style="display: none;">
        <div class="header">
            <h1>CMS Admin Dashboard</h1>
            <div class="header-actions">
                <button id="create-post-btn" class="btn-primary">+ New Post</button>
                <button id="logout-btn" class="btn-cancel">Logout</button>
            </div>
        </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="posts-table-body">

            </tbody>
        </table>
    </div>

    <div id="post-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Create New Post</h2>
            
            <form id="post-form">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="post-title" required>
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="post-status">
                        <option value="draft">Draft (Hidden)</option>
                        <option value="published">Published (Public)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="post-content" rows="6" required></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>
    <script type="module" src="../src/pages/admin.js"></script>
</body>
</html>
