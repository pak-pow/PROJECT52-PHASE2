<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Sign In</title>
    <link rel="stylesheet" href="./styles/style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body>
    <div class="login-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>

            <div id="errorMessage" class="message error-box hidden">
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-full mt-4">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html" class="auth-link">Create one</a>
            </div>
        </div>
    </div>
    <script type="module" src="../src/pages/login.js"></script>
</body>
</html>
