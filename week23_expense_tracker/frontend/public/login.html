<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Login</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back</h2>
        
        <div id="errorMessage" class="message error-box hidden">
            <span id="errorText"></span>
        </div>
        
        <div id="successMessage" class="message success-box hidden">
            <span id="successText"></span>
        </div>

        <form id="authForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="******************" required>
            </div>
            
            <div class="button-group">
                <button type="button" id="loginBtn" class="btn btn-primary">Sign In</button>
                <button type="button" id="registerBtn" class="btn btn-secondary">Register</button>
            </div>
        </form>
    </div>

    <script type="module" src="../src/pages/login.js"></script>
</body>
</html>
