<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Dashboard</title>
    <link rel="stylesheet" href="./styles/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Expense Tracker</div>
        <div class="nav-user">
            <span id="welcomeMessage">Loading profile...</span>
            <div class="currency-selector-wrapper">
                <select id="currencySelect" class="currency-select" title="Change display currency">
                    <!-- Populated by dashboard.js -->
                </select>
            </div>
            <button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button>
        </div>
    </nav>


    <main class="dashboard-container">
        <div class="dashboard-grid">
            
            <section class="card">
                <h3>Log an Expense</h3>
                <form id="addExpenseForm">
                    <div class="input-group">
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="__new__">+ Add New Category</option>
                        </select>
                    </div>
                    <div class="input-group hidden" id="customCategoryGroup">
                        <label for="customCategory">New Category Name</label>
                        <input id="customCategory" type="text" placeholder="Enter custom category">
                    </div>
                    <div class="input-group">
                        <label for="date">Date</label>
                        <input id="date" type="date" required>
                    </div>
                    <div class="input-group">
                        <label for="description">Description (Optional)</label>
                        <input id="description" type="text" placeholder="What was this for?">
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Save Expense</button>
                </form>
            </section>

            <!-- Budget Limits Card -->
            <section class="card">
                <h3>Budget Limits</h3>
                <form id="budgetForm">
                    <div class="input-group">
                        <label for="budgetCategory">Category</label>
                        <select id="budgetCategory" class="form-select" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="budgetAmount">Monthly Limit</label>
                        <input id="budgetAmount" type="number" step="0.01" placeholder="0.00">
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Set Budget</button>
                </form>
                <div id="budgetList" class="budget-list"></div>
            </section>

            <div class="right-column-stack">
                
                <section class="card">
                    <div id="budgetWarnings"></div>
                    <h3 class="breakdown-header">
                        Spending Breakdown
                        <span id="totalSpendingBadge" class="total-badge"></span>
                    </h3>
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </section>

                <section class="card">
                    <div class="breakdown-header mb-4">
                        <h3 class="mb-0">Recent Expenses</h3>
                        <button id="exportCsvBtn" class="btn btn-secondary btn-sm">⬇ Download CSV</button>
                    </div>
                    
                    <div class="filter-bar">
                        <input type="date" id="filterStartDate" class="filter-input" title="Start Date">
                        <input type="date" id="filterEndDate" class="filter-input" title="End Date">
                        <select id="filterCategory" class="filter-input">
                            <option value="All">All Categories</option>
                        </select>
                        <button id="clearFilterBtn" class="btn btn-secondary btn-sm clear-filter-btn">Clear</button>
                    </div>

                    <div class="table-container">
                        <table class="expense-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTableBody">
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        
        </div>
    </main>

    <!-- ── Edit Expense Modal ─────────────────────────────────────────── -->
    <dialog id="editModal" class="edit-modal">
        <div class="edit-modal-card">
            <div class="edit-modal-header">
                <h3>Edit Expense</h3>
                <button id="closeEditModal" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <form id="editExpenseForm">
                <input type="hidden" id="editExpenseId">
                <div class="input-group">
                    <label for="editAmount">Amount</label>
                    <input id="editAmount" type="number" step="0.01" placeholder="0.00" required>
                </div>
                <div class="input-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory" class="form-select" required>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="editDate">Date</label>
                    <input id="editDate" type="date" required>
                </div>
                <div class="input-group">
                    <label for="editDescription">Description (Optional)</label>
                    <input id="editDescription" type="text" placeholder="What was this for?">
                </div>
                <div class="edit-modal-actions">
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </dialog>

    <script type="module" src="../src/pages/dashboard.js"></script>
</body>
</html>
