<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fast, competitive quiz platform with live leaderboards. Test your knowledge across Web Dev and Python categories."
    />
    <title>QuizArena | Week 28</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Styles (split by view) -->
    <link rel="stylesheet" href="../src/assets/base.css" />
    <link rel="stylesheet" href="../src/assets/catalog.css" />
    <link rel="stylesheet" href="../src/assets/quiz.css" />
    <link rel="stylesheet" href="../src/assets/results.css" />
    <link rel="stylesheet" href="../src/assets/leaderboard.css" />
    <link rel="stylesheet" href="../src/assets/modal.css" />
  </head>

  <body>
    <div id="app">
      <!-- View shells — HTML is injected by each page JS module on boot -->
      <section id="view-catalog"     class="view active"></section>
      <section id="view-quiz"        class="view"></section>
      <section id="view-results"     class="view"></section>
      <section id="view-leaderboard" class="view"></section>

      <!-- Modal shell — injected by modal.js on boot -->
      <div id="modal-container"></div>
    </div>

    <script type="module" src="../src/main.js"></script>
  </body>
</html>
