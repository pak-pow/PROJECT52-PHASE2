<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project52 Week 30 — A Twitter/X-style social media feed built with Flask and Vanilla JS." />
  <title>SocialFeed | Project52 Week 30</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/assets/base.css" />
  <link rel="stylesheet" href="src/assets/auth.css" />
  <link rel="stylesheet" href="src/assets/feed.css" />
  <link rel="stylesheet" href="src/assets/compose.css" />
  <link rel="stylesheet" href="src/assets/profile.css" />
</head>
<body>

  <!-- ── App Shell ────────────────────────────────── -->
  <div id="app">

    <!-- Auth Screen (shown when logged out) -->
    <section id="auth-screen" class="auth-screen hidden">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="logo-icon">🌐</span>
          <h1 class="logo-title">SocialFeed</h1>
          <p class="logo-sub">Project52 · Week 30</p>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true" data-target="login-form">Login</button>
          <button class="auth-tab" id="tab-register" role="tab" aria-selected="false" data-target="register-form">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input id="login-username" type="text" placeholder="your_username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <p class="auth-error hidden" id="login-error"></p>
          <button type="submit" class="btn-primary btn-full" id="login-submit">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input id="reg-username" type="text" placeholder="your_username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="reg-display">Display Name</label>
            <input id="reg-display" type="text" placeholder="Your Name" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" placeholder="min 6 characters" autocomplete="new-password" required />
          </div>
          <p class="auth-error hidden" id="register-error"></p>
          <button type="submit" class="btn-primary btn-full" id="register-submit">Create Account</button>
        </form>
      </div>
    </section>

    <!-- Main App (shown when logged in) -->
    <div id="main-app" class="main-app hidden">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <span class="logo-icon">🌐</span>
          <span class="logo-title">SocialFeed</span>
        </div>
        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="#feed"    class="nav-item active" id="nav-feed"    data-page="feed">    <span class="nav-icon">🏠</span> <span class="nav-label">Home</span>    </a>
          <a href="#explore" class="nav-item"         id="nav-explore" data-page="explore"> <span class="nav-icon">🔥</span> <span class="nav-label">Explore</span> </a>
          <a href="#profile" class="nav-item"         id="nav-profile" data-page="profile"> <span class="nav-icon">👤</span> <span class="nav-label">Profile</span> </a>
        </nav>
        <button class="btn-primary sidebar-compose" id="sidebar-compose-btn">+ Post</button>
        <div class="sidebar-user" id="sidebar-user">
          <div class="avatar avatar-sm" id="sidebar-avatar">?</div>
          <div class="sidebar-user-info">
            <span class="sidebar-display-name" id="sidebar-display-name">—</span>
            <span class="sidebar-username" id="sidebar-username">—</span>
          </div>
          <button class="btn-ghost btn-logout" id="logout-btn" title="Logout">↪</button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content" id="content" role="main">

        <!-- Feed Page -->
        <section id="page-feed" class="page active">
          <header class="page-header">
            <h2>Home</h2>
          </header>
          <div class="compose-inline" id="inline-compose">
            <div class="avatar avatar-md" id="compose-avatar">?</div>
            <div class="compose-inline-right">
              <textarea id="compose-input" class="compose-textarea" placeholder="What's on your mind?" maxlength="280" rows="2"></textarea>
              <div class="compose-actions">
                <span class="char-counter" id="char-counter">280</span>
                <label class="btn-ghost icon-btn" for="compose-image-input" title="Attach image">📷</label>
                <input type="file" id="compose-image-input" accept="image/*" class="hidden" />
                <button class="btn-primary" id="compose-submit-btn">Post</button>
              </div>
            </div>
          </div>
          <div id="feed-list" class="post-list" role="feed" aria-live="polite"></div>
          <div id="feed-loader" class="feed-loader hidden">Loading more…</div>
        </section>

        <!-- Explore Page -->
        <section id="page-explore" class="page hidden">
          <header class="page-header">
            <h2>🔥 Trending</h2>
            <p class="page-sub">Most liked posts in the last 24 hours</p>
          </header>
          <div id="explore-list" class="post-list" role="feed" aria-live="polite"></div>
          <div id="explore-loader" class="feed-loader hidden">Loading more…</div>
        </section>

        <!-- Profile Page -->
        <section id="page-profile" class="page hidden">
          <div id="profile-container"></div>
        </section>

        <!-- Post Detail Page -->
        <section id="page-post-detail" class="page hidden">
          <header class="page-header">
            <button class="btn-ghost back-btn" id="back-btn">← Back</button>
            <h2>Post</h2>
          </header>
          <div id="post-detail-container"></div>
          <div id="replies-container" class="post-list"></div>
        </section>

      </main>

      <!-- Right Panel (desktop only) -->
      <aside class="right-panel" id="right-panel" aria-label="Trending sidebar">
        <div class="right-panel-inner">
          <h3 class="panel-title">Who to follow</h3>
          <div id="suggestions-list"></div>
        </div>
      </aside>

    </div><!-- /main-app -->

  </div><!-- /app -->

  <!-- Compose Modal (full-screen on mobile) -->
  <div id="compose-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="New post">
    <div class="modal-card">
      <div class="modal-header">
        <button class="btn-ghost modal-close" id="modal-close-btn">✕</button>
        <h3>New Post</h3>
        <button class="btn-primary modal-post-btn" id="modal-post-btn">Post</button>
      </div>
      <div class="modal-body">
        <div class="avatar avatar-md" id="modal-avatar">?</div>
        <textarea id="modal-compose-input" class="compose-textarea" placeholder="What's on your mind?" maxlength="280" rows="4"></textarea>
      </div>
      <div class="modal-footer">
        <span class="char-counter" id="modal-char-counter">280</span>
        <label class="btn-ghost icon-btn" for="modal-image-input" title="Attach image">📷</label>
        <input type="file" id="modal-image-input" accept="image/*" class="hidden" />
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden" role="alert" aria-live="assertive"></div>

  <!-- JS Entry Point -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
