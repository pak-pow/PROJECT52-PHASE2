<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Week 19: Markdown Notes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <h2>My Notes</h2>
                <button id="new-note-btn">New Note</button>
                <ul id="note-list">
                </ul>
            </aside>

            <main class="editor-pane">
            <div id="editor-container" class="hidden">
                <div class="editor-header">
                    <input type="text" id="note-title-input" placeholder="Filename (e.g., my_note.md)">
                    <button id="save-note-btn">💾 Save</button>
                </div>
                <textarea id="markdown-editor" placeholder="Start typing your markdown here..."></textarea>
            </div>
            <h1 id="welcome-text">Select a note to begin...</h1>
            </main>
        </div>
        
        <script src="app.js" async defer></script>
    </body>
</html>
