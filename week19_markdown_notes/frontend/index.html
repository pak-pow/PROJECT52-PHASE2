<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Week 19: Markdown Notes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <h2>My Notes</h2>
                <button id="new-note-btn">New Note</button>
                <input type="text" id="search-input" placeholder="Search notes...">
                <ul id="note-list">
                </ul>
            </aside>

            <main class="editor-pane">
                <div id="editor-container" class="hidden">
                    
                    <div class="editor-header">
                        <input type="text" id="note-title-input" placeholder="Filename (e.g., my_note.md)">
                        <button id="save-note-btn">Save</button>
                        <button id="delete-note-btn">Delete</button>
                    </div>
                    
                    <div class="workspace-split">
                        <textarea id="markdown-editor" placeholder="Start typing your markdown here..."></textarea>
                        <div id="markdown-preview" class="markdown-body"></div>
                    </div>
                    
                    <div id="word-count">0 words &middot; 0 characters</div>
                    
                </div>
                <h1 id="welcome-text">Select a note to begin...</h1>
            </main>
        </div>

        <div id="toast-container"></div>
        
        <script src="app.js" async defer></script>
    </body>
</html>
