<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recipe Hub — save, browse, and share your favourite recipes. Add photos, ingredients, and step-by-step instructions.">
    <title>Recipe Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/assets/variables.css">
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/layout.css">
    <link rel="stylesheet" href="../src/assets/components.css">
</head>
<body>

    <!-- ===== Main App ===== -->
    <div class="container">

        <header class="app-header">
            <div class="header-brand">
                <i data-lucide="utensils" class="header-icon-svg"></i>
                <h1>Recipe Hub</h1>
            </div>
            <button id="add-recipe-btn" class="btn-primary">
                <i data-lucide="plus"></i> New Recipe
            </button>
        </header>

        <!-- Recipe Grid -->
        <div id="recipe-grid" class="grid"></div>

        <!-- Pagination -->
        <div id="pagination" class="pagination hidden"></div>

    </div>

    <!-- ===== Add Recipe Modal ===== -->
    <div id="recipe-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="add-modal-title">Add New Recipe</h2>
                <button id="close-modal-btn" class="icon-btn" aria-label="Close modal">&times;</button>
            </div>

            <form id="add-recipe-form">
                <div class="form-group">
                    <label for="title">Recipe Title</label>
                    <input type="text" id="title" name="title" required placeholder="e.g. Classic Carbonara">
                </div>

                <div class="form-group">
                    <label for="description">Short Description</label>
                    <input type="text" id="description" name="description" required placeholder="A brief summary...">
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingredients (one per line)</label>
                    <textarea id="ingredients" name="ingredients" rows="4" required placeholder="400g spaghetti&#10;200g pancetta..."></textarea>
                </div>

                <div class="form-group">
                    <label for="instructions">Instructions</label>
                    <textarea id="instructions" name="instructions" rows="4" required placeholder="1. Boil water...&#10;2. Fry pancetta..."></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Recipe Photo</label>
                    <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp">
                </div>

                <div class="modal-footer">
                    <button type="submit" id="submit-recipe-btn" class="btn-primary">Save Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Edit Recipe Modal ===== -->
    <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Edit Recipe</h2>
                <button id="close-edit-modal-btn" class="icon-btn" aria-label="Close edit modal">&times;</button>
            </div>

            <form id="edit-recipe-form">
                <input type="hidden" id="edit-recipe-id" name="id">

                <div class="form-group">
                    <label for="edit-title">Recipe Title</label>
                    <input type="text" id="edit-title" name="title" required placeholder="e.g. Classic Carbonara">
                </div>

                <div class="form-group">
                    <label for="edit-description">Short Description</label>
                    <input type="text" id="edit-description" name="description" required placeholder="A brief summary...">
                </div>

                <div class="form-group">
                    <label for="edit-ingredients">Ingredients (one per line)</label>
                    <textarea id="edit-ingredients" name="ingredients" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-instructions">Instructions</label>
                    <textarea id="edit-instructions" name="instructions" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-image">Replace Photo <span class="text-muted">(optional)</span></label>
                    <input type="file" id="edit-image" name="image" accept="image/png, image/jpeg, image/webp">
                </div>

                <div class="modal-footer">
                    <button type="submit" id="submit-edit-btn" class="btn-primary">Update Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== View Recipe Modal ===== -->
    <div id="view-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="view-modal-title">
        <div class="modal-content view-modal-content">
            <div class="modal-header">
                <h2 id="view-modal-title" class="view-modal-title">Recipe</h2>
                <button id="close-view-modal-btn" class="icon-btn" aria-label="Close">&times;</button>
            </div>

            <img id="view-modal-img" src="" alt="" class="view-modal-img">

            <p id="view-modal-description" class="view-modal-description"></p>

            <div class="view-modal-sections">
                <section class="view-section">
                    <h3 class="view-section-heading"><i data-lucide="list"></i> Ingredients</h3>
                    <pre id="view-modal-ingredients" class="view-section-body"></pre>
                </section>

                <section class="view-section">
                    <h3 class="view-section-heading"><i data-lucide="book-open"></i> Instructions</h3>
                    <pre id="view-modal-instructions" class="view-section-body"></pre>
                </section>
            </div>

            <div class="view-modal-actions">
                <button id="view-edit-btn"   class="btn-primary"><i data-lucide="pencil"></i> Edit Recipe</button>
                <button id="view-delete-btn" class="btn-danger"><i data-lucide="trash-2"></i> Delete</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast Notification ===== -->
    <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script type="module" src="../src/main.js"></script>
</body>
</html>
