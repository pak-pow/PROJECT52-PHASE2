<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Registration — Rate Limiter</title>
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/auth.css">
    <script>
        (function() {
            var theme = localStorage.getItem("limiter_theme") || "dark";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="main-content">
        <div class="auth-card">
            <h2>📝 Developer Registration</h2>
            <p>Register a new developer account to generate rate-limited API Keys.</p>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Developer Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="Vee (Data Science)" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="dev@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-tier">Initial Subscription Tier</label>
                    <select id="reg-tier" class="form-input" style="cursor: pointer;">
                        <option value="free">Free Tier (5 reqs / min)</option>
                        <option value="pro">Pro Tier (30 reqs / min)</option>
                        <option value="enterprise">Enterprise Tier (100 reqs / min)</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    ✨ Create Developer Account
                </button>
            </form>

            <p class="auth-footer-text">
                Already registered? <a href="login.html" class="auth-link">Login & Manage Keys</a>
            </p>
        </div>
    </main>

    <script type="module" src="../src/pages/registerPage.js"></script>
</body>
</html>
