<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookify — Register</title>
    <script>
        (function() {
            var t = localStorage.getItem("booking_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/auth.css">
</head>
<body>
    <header id="app-header" class="app-header"></header>

    <main class="main-content">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p>Join Bookify to reserve appointment time slots instantly</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. sarah_c" required autofocus>
                </div>
                <div class="form-group">
                    <label for="display_name">Full Name</label>
                    <input type="text" id="display_name" class="form-input" placeholder="e.g. Sarah Connor" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="sarah@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password (min 6 characters)</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account ➔</button>
            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html" class="auth-link">Log in</a>
            </p>
        </div>
    </main>

    <script type="module" src="../src/pages/registerPage.js"></script>
</body>
</html>
