<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookify — Login</title>
    <script>
        (function() {
            var t = localStorage.getItem("booking_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/auth.css">
</head>
<body>
    <header id="app-header" class="app-header"></header>

    <main class="main-content">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Log in to manage your appointments & bookings</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. alice" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In ➔</button>
            </form>

            <p class="auth-footer-text">
                Don't have an account? <a href="register.html" class="auth-link">Create one</a>
            </p>
        </div>
    </main>

    <script type="module" src="../src/pages/loginPage.js"></script>
</body>
</html>
