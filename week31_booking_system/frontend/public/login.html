<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookify — Login</title>
    <script>
        (function() {
            var t = localStorage.getItem("booking_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/assets/base.css">
    <style>
        .auth-card {
            max-width: 420px;
            margin: 3rem auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }
        .auth-card h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        .auth-card p { color: var(--text-secondary); font-size: 0.95rem; text-align: center; margin-bottom: 1.75rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .form-input {
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color var(--transition);
        }
        .form-input:focus { border-color: var(--accent); }
    </style>
</head>
<body>
    <header id="app-header" class="app-header"></header>

    <main class="main-content">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Log in to manage your appointments & bookings</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. alice" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In ➔</button>
            </form>

            <p style="margin-top: 1.5rem; margin-bottom: 0; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--accent-light); font-weight: 600;">Create one</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { renderNavbar } from "../src/components/navbar.js";
        import { apiLogin } from "../src/api/authApi.js";
        import { showToast } from "../src/utils/helpers.js";

        document.addEventListener("DOMContentLoaded", () => {
            renderNavbar();
            const form = document.getElementById("login-form");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value;
                try {
                    await apiLogin(username, password);
                    showToast("Login successful!", "success");
                    setTimeout(() => window.location.href = "index.html", 500);
                } catch (err) {
                    showToast(err.message, "error");
                }
            });
        });
    </script>
</body>
</html>
