<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveChat | Project 52</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <h2>Global Chat</h2>
            </div>
            <span id="connectio-status" class="offline">Offline</span>
        </header>

        <div id="chat-window" class="chat-window">
            <div class="message received">
                <span class="username">System</span>
                <p>Welcome to the server. Waiting for Connection</p>
            </div>

            <div class="message sent">
                <span class="username">You</span>
                <p>This is what my message will look like when i send them.</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
</body>
</html>
