<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveChat | Project 52</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="join-screen" class="join-screen">
        <h2>Join LiveChat</h2>
        <input type="text" id="join-username-input" placeholder="Enter your name..." autocomplete="off" autofocus>
        <button id="join-btn">Join Chat</button>
    </div>

    <div id="chat-container" class="chat-container hidden">
        
        <header class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <span id="display-username" class="display-username">Guest</span>
            </div>
            <span id="connection-status" class="offline">Offline</span>
        </header>

        <div id="chat-window" class="chat-window"> </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
