<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    
    <link rel="stylesheet" href="../src/assets/variables.css">
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/layout.css">
    <link rel="stylesheet" href="../src/assets/components.css">
</head>
<body>
    <div class="container">
        
        <header>
            <h1>URL Engine</h1>
            <p class="text-muted">Project 52 | Phase 2</p>
        </header>

        <div class="card">
            <form id="shorten-form">
                <div class="input-group">
                    <label for="url">Original URL *</label>
                    <input type="url" id="url" placeholder="https://www.example.com" required>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label for="custom-alias">Custom Alias (Optional)</label>
                        <input type="text" id="custom-alias" placeholder="summer-sale">
                    </div>
                    <div class="input-group">
                        <label for="expires-in">Expires In (Hours - Optional)</label>
                        <input type="number" id="expires-in" placeholder="24" min="1">
                    </div>
                </div>

                <div id="form-error" class="error-message hidden"></div>
                <button type="submit" class="btn-submit">Generate Short Link</button>
            </form>
        </div>

        <div class="card result-card hidden" id="result-card">
            <h3 class="text-muted header-sm">Your Link is Ready</h3>
            <a id="short-url-result" href="#" target="_blank" class="result-link"></a>
            <p id="death-clock-display" class="death-clock-text"></p>
        </div>

    </div>

    <script type="module" src="../src/main.js"></script>
</body>
</html>
