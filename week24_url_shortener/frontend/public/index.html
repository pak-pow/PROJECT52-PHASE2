<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Engine — Project 52</title>
    <meta name="description" content="URL Engine: shorten long links into clean, shareable short URLs with optional custom aliases and expiry times.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet" href="../src/assets/variables.css">
    <link rel="stylesheet" href="../src/assets/base.css">
    <link rel="stylesheet" href="../src/assets/layout.css">
    <link rel="stylesheet" href="../src/assets/components.css">

</head>
<body>

    <div class="page-wrapper">

        <!-- ── Header ──────────────────────────────────────────────── -->
        <header class="site-header">
            <span class="logo-icon">
                <svg class="icon icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </span>
            <h1>URL Engine</h1>
            <p>Project 52 &middot; Phase 2 &mdash; Week 24</p>
        </header>

        <!-- ── Shorten Form Card ────────────────────────────────────── -->
        <div class="card">
            <form id="shorten-form" novalidate>

                <div class="input-group">
                    <label for="url">Original URL <span class="required-star">*</span></label>
                    <input type="url" id="url" placeholder="https://www.example.com/very/long/path" autocomplete="off" required>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label for="custom-alias">
                            Custom Alias
                            <span class="label-hint">(optional)</span>
                        </label>
                        <input type="text" id="custom-alias" placeholder="summer-sale" maxlength="20">
                    </div>
                    <div class="input-group">
                        <label for="expires-in">
                            Expires In
                            <span class="label-hint">(hours, optional)</span>
                        </label>
                        <input type="number" id="expires-in" placeholder="24" min="1" max="8760">
                    </div>
                </div>

                <div id="form-error" class="error-message hidden"></div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span id="submit-btn-icon" class="btn-icon-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </span>
                    <span id="submit-btn-text">Generate Short Link</span>
                </button>

            </form>
        </div>

        <!-- ── Link Analytics Card ──────────────────────────────────── -->
        <div class="card card-analytics">
            <div class="analytics-header">
                <h2>Link Analytics</h2>
                <button id="refresh-stats" class="btn-refresh">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    Refresh
                </button>
            </div>
            
            <div class="table-container">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Short Code</th>
                            <th>Original URL</th>
                            <th>Clicks</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body">
                    </tbody>
                </table>
            </div>
        </div>

    </div><!-- /.page-wrapper -->


    <!-- ── Result Modal ─────────────────────────────────────────────── -->
    <div class="modal-backdrop" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">

        <div class="modal">

            <div class="modal-header">
                <div class="modal-title">
                    <div class="success-icon">
                        <svg class="icon success-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h2 id="modal-heading">Your link is ready!</h2>
                </div>
                <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
            </div>

            <div class="modal-body">

                <!-- Short URL box with copy button -->
                <div class="short-url-box">
                    <a id="short-url-link" href="#" target="_blank" rel="noopener noreferrer">—</a>
                    <button class="btn-copy" id="copy-btn" title="Copy to clipboard">
                        <span id="copy-icon" class="copy-icon-wrapper">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </span>
                        <span id="copy-text">Copy</span>
                    </button>
                </div>

                <!-- Meta info -->
                <div class="modal-meta">
                    <div class="meta-row">
                        <span class="meta-label">Original:</span>
                        <span class="meta-value" id="meta-original">—</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Clicks:</span>
                        <span class="meta-value" id="meta-clicks">0</span>
                    </div>
                    <div id="expiry-badge" class="expiry-badge hidden">
                        <svg class="icon icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span id="expiry-text"></span>
                    </div>
                </div>

                <!-- New link button -->
                <button class="btn-new" id="new-link-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Shorten another link
                </button>

            </div>
        </div>

    </div><!-- /#result-modal -->

    <script type="module" src="../src/main.js"></script>
</body>
</html>
