<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Weather Dashboard</h1>
        
        <div class="search-container">
            <input type="text" id="city-input" placeholder="Enter a city name...">
            <button id="search-btn">Search</button>
        </div>

        <div id="weather-card" class="card">
            
            <div id="current-weather">
                <p id="loading-text">Fetching live data from satellite...</p>
            </div>
            
            <div class="chart-container">
                <canvas id="hourlyChart"></canvas>
            </div>

            <div class="forecast-section">
                <h4 class="forecast-title">7-Day Forecast</h4>
                <div id="weekly-forecast" class="weekly-container">
                </div>
            </div>
            
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
